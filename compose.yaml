services:
  resource-db:
    image: postgres:16-alpine
    container_name: resource-db
    environment:
      POSTGRES_DB: resource_db
      POSTGRES_USER: resource_user
      POSTGRES_PASSWORD: resource_password
    ports:
      - "5432:5432"
    volumes:
      - resource-db-data:/var/lib/postgresql/data

  song-db:
    image: postgres:16-alpine
    container_name: song-db
    environment:
      POSTGRES_DB: song_db
      POSTGRES_USER: song_user
      POSTGRES_PASSWORD: song_password
    ports:
      - "5433:5432"
    volumes:
      - song-db-data:/var/lib/postgresql/data

volumes:
  resource-db-data:
  song-db-data: