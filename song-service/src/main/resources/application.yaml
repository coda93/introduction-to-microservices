server:
  port: 8072

spring:
  application:
    name: song-service
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/song_db}"
    username: "${SPRING_DATASOURCE_USERNAME:song_user}"
    password: "${SPRING_DATASOURCE_PASSWORD:song_password}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
