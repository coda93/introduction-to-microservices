server:
  port: 8071

spring:
  application:
    name: resource-service
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource_db}"
    username: "${SPRING_DATASOURCE_USERNAME:resource_user}"
    password: "${SPRING_DATASOURCE_PASSWORD:resource_password}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

song-service:
  base-url: "${SONG_SERVICE_BASE_URL:http://localhost:8072}"
